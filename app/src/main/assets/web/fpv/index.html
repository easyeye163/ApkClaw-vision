<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>灵境 · 3D飞行探索</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Segoe UI',system-ui,sans-serif;}
#canvasWrap{position:fixed;inset:0;z-index:0;}
canvas{display:block;width:100%;height:100%;}

/* ── Start Screen ── */
#startScreen{
  position:fixed;inset:0;z-index:100;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#0a0e27 0%,#1b2a5c 40%,#2d4a8c 70%,#4a7cc9 100%);
  color:#fff;text-align:center;
  transition:opacity .6s ease,visibility .6s ease;
}
#startScreen.hidden{opacity:0;visibility:hidden;pointer-events:none;}
#startScreen h1{font-size:clamp(2rem,6vw,3.6rem);font-weight:800;letter-spacing:.04em;margin-bottom:.3em;text-shadow:0 2px 20px rgba(0,0,0,.5);}
#startScreen p{font-size:clamp(.9rem,2.5vw,1.15rem);opacity:.85;margin-bottom:2em;max-width:420px;line-height:1.6;}
#startBtn{
  padding:.9em 3em;font-size:1.15rem;font-weight:700;border:none;border-radius:50px;
  background:linear-gradient(135deg,#f9a825,#ff6f00);color:#fff;cursor:pointer;
  box-shadow:0 4px 24px rgba(255,111,0,.45);transition:transform .2s,box-shadow .2s;
}
#startBtn:hover{transform:scale(1.05);box-shadow:0 6px 32px rgba(255,111,0,.65);}
#startBtn:active{transform:scale(.97);}
.controls-hint{margin-top:1.6em;font-size:.8rem;opacity:.6;line-height:1.7;}

/* ── HUD ── */
#hud{
  position:fixed;top:0;left:0;right:0;z-index:50;
  display:flex;justify-content:space-between;align-items:flex-start;
  padding:14px 20px;pointer-events:none;
  opacity:0;transition:opacity .5s ease;
}
#hud.visible{opacity:1;}
.hud-box{
  background:rgba(0,0,0,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.12);border-radius:12px;
  padding:8px 16px;color:#fff;font-size:.85rem;font-weight:600;
  display:flex;align-items:center;gap:8px;
}
.hud-box .label{opacity:.6;font-weight:400;font-size:.75rem;letter-spacing:.06em;}
.hud-box .val{font-variant-numeric:tabular-nums;min-width:48px;text-align:right;}

/* ── Flight Mode Toggle ── */
#modeToggle{
  position:fixed;top:12px;left:12px;z-index:65;
  padding:6px 14px;border-radius:20px;border:1.5px solid rgba(255,255,255,.2);
  background:rgba(0,0,0,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  color:#fff;font-size:.75rem;font-weight:600;cursor:pointer;
  pointer-events:auto;display:flex;align-items:center;gap:6px;
  -webkit-tap-highlight-color:transparent;user-select:none;
  transition:background .2s,transform .15s;
  opacity:0;transition:opacity .5s ease,background .2s,transform .15s;
}
#modeToggle.visible{opacity:1;}
#modeToggle:active{transform:scale(.93);}
#modeToggle .mode-dot{width:8px;height:8px;border-radius:50%;}
#modeToggle .mode-dot.stable{background:#4caf50;box-shadow:0 0 6px rgba(76,175,80,.6);}
#modeToggle .mode-dot.manual{background:#ff9800;box-shadow:0 0 6px rgba(255,152,0,.6);}

/* ── Chat Panel ── */
#chatPanel{
  position:fixed;bottom:0;right:0;z-index:60;
  width:min(380px,92vw);height:60vh;
  background:rgba(10,14,39,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top-left-radius:16px;border:1px solid rgba(255,255,255,.08);
  border-right:none;border-bottom:none;
  display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);
  overflow:hidden;
}
#chatPanel.open{transform:translateX(0);}
#chatToggle{
  position:fixed;top:12px;right:12px;z-index:65;
  width:48px;height:48px;border-radius:50%;
  background:linear-gradient(135deg,#4a7cc9,#1e88e5);border:2px solid rgba(255,255,255,.25);
  color:#fff;font-size:1.4rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  pointer-events:auto;
  box-shadow:0 2px 12px rgba(30,136,229,.5);
  -webkit-tap-highlight-color:transparent;user-select:none;
  transition:transform .2s,box-shadow .2s;
}
#chatToggle:active{transform:scale(.9);box-shadow:0 1px 6px rgba(30,136,229,.4);}
#chatHeader{
  padding:10px 14px;font-size:.85rem;font-weight:700;color:rgba(255,255,255,.7);
  border-bottom:1px solid rgba(255,255,255,.06);flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
}
#chatClose{
  background:none;border:none;color:rgba(255,255,255,.45);
  font-size:1.3rem;cursor:pointer;padding:0 2px;line-height:1;
}
#chatClose:hover{color:rgba(255,255,255,.9);}
#chatMessages{
  flex:1;overflow-y:auto;padding:10px 12px;
  will-change:transform;
  -webkit-overflow-scrolling:touch;
}
#chatMessages::-webkit-scrollbar{width:4px;}
#chatMessages::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:4px;}
.msg{
  margin-bottom:8px;padding:8px 12px;border-radius:10px;
  font-size:.82rem;line-height:1.55;word-wrap:break-word;
  opacity:0;transform:translateY(8px);
  max-width:100%;
}
.msg.user{background:rgba(74,124,201,.3);color:#c8deff;align-self:flex-end;margin-left:20%;}
.msg.bot{background:rgba(255,255,255,.07);color:rgba(255,255,255,.85);margin-right:12%;}
.msg.system{background:rgba(255,193,7,.12);color:#ffd54f;font-style:italic;font-size:.78rem;}
#chatInputWrap{
  display:flex;gap:8px;padding:10px 12px;
  border-top:1px solid rgba(255,255,255,.06);flex-shrink:0;
}
#voiceBtn{
  width:36px;height:36px;border-radius:50%;border:none;flex-shrink:0;
  background:rgba(30,136,229,.5);color:#fff;font-size:1rem;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent;transition:background .2s;
}
#voiceBtn:active{background:rgba(30,136,229,.8);}
#chatInput{
  flex:1;padding:8px 12px;border:1px solid rgba(255,255,255,.12);border-radius:10px;
  background:rgba(255,255,255,.06);color:#fff;font-size:.85rem;outline:none;
}
#chatInput::placeholder{color:rgba(255,255,255,.3);}
#chatInput:focus{border-color:rgba(74,124,201,.6);}
#chatSend{
  padding:8px 16px;border:none;border-radius:10px;
  background:linear-gradient(135deg,#f9a825,#ff6f00);color:#fff;font-weight:700;
  font-size:.85rem;cursor:pointer;flex-shrink:0;
}

/* ── Notification ── */
#notification{
  position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-20px);z-index:70;
  background:rgba(249,168,37,.92);color:#1a1a2e;padding:10px 24px;border-radius:50px;
  font-weight:700;font-size:.95rem;pointer-events:none;
  opacity:0;transition:opacity .4s,transform .4s;
  white-space:nowrap;
}
#notification.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── Completion Screen ── */
#completionScreen{
  position:fixed;inset:0;z-index:100;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(0,0,0,.75);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  color:#fff;text-align:center;
  opacity:0;visibility:hidden;transition:opacity .6s,visibility .6s;
}
#completionScreen.visible{opacity:1;visibility:visible;}
#completionScreen h2{font-size:clamp(1.8rem,5vw,3rem);font-weight:800;margin-bottom:.4em;color:#f9a825;}
#completionScreen p{font-size:1.05rem;opacity:.8;margin-bottom:1.5em;}
#restartBtn{
  padding:.8em 2.5em;font-size:1rem;font-weight:700;border:none;border-radius:50px;
  background:linear-gradient(135deg,#4a7cc9,#2d4a8c);color:#fff;cursor:pointer;
  box-shadow:0 4px 20px rgba(45,74,140,.5);transition:transform .2s;
}
#restartBtn:hover{transform:scale(1.05);}

/* ── Virtual Joysticks ── */
.joystick-zone{
  position:fixed;bottom:30px;z-index:55;
  width:140px;height:140px;
  display:none;pointer-events:auto;
}
.joystick-zone.left{left:30px;}
.joystick-zone.right{right:30px;}
.joystick-base{
  position:absolute;inset:0;border-radius:50%;
  background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.15);
}
.joystick-knob{
  position:absolute;width:54px;height:54px;border-radius:50%;
  background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.35);
  left:50%;top:50%;transform:translate(-50%,-50%);
  box-shadow:0 0 12px rgba(0,0,0,.3);
}
.joystick-label{
  position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);
  color:rgba(255,255,255,.35);font-size:.65rem;white-space:nowrap;
}
</style>
</head>
<body>

<div id="canvasWrap"></div>

<!-- 开始画面 -->
<div id="startScreen">
  <h1>灵境 · 3D飞行探索</h1>
  <p>在美丽的3D世界中自由飞行，收集隐藏在山峦、森林和湖泊间的12个宝箱，用AI语音建造你想象中的场景。</p>
  <button id="startBtn">起飞</button>
  <div class="controls-hint">
    左摇杆 — 方向/油门/下降 &nbsp;|&nbsp; 右摇杆 — 俯仰/翻滚<br>右上角 💬 打开AI助手，语音或文字描述你想建造的场景
  </div>
</div>

<!-- HUD -->
<div id="hud">
  <div class="hud-box"><span class="label">速度</span><span class="val" id="hudSpeed">0</span></div>
  <div class="hud-box"><span class="label">高度</span><span class="val" id="hudAlt">0</span></div>
  <div class="hud-box"><span class="label">宝箱</span><span class="val" id="hudChests">0/12</span></div>
</div>

<!-- 聊天面板 -->
<div id="chatPanel">
  <div id="chatHeader"><span>AI 助手</span><button id="chatClose" aria-label="关闭">&times;</button></div>
  <div id="chatMessages"></div>
  <div id="chatInputWrap">
    <button id="voiceBtn" aria-label="语音输入">&#x1f3a4;</button>
    <input id="chatInput" type="text" placeholder="输入建造指令..." autocomplete="off">
    <button id="chatSend">发送</button>
  </div>
</div>

<!-- 通知 -->
<div id="notification"></div>

<!-- 完成画面 -->
<div id="completionScreen">
  <h2>全部宝箱已找到！</h2>
  <p>你探索了世界的每一个角落，干得漂亮，飞行员！</p>
  <button id="restartBtn">再飞一次</button>
</div>

<!-- 虚拟摇杆 -->
<div class="joystick-zone left" id="joystickLeft">
  <div class="joystick-base"><div class="joystick-knob"></div></div>
  <div class="joystick-label">方向/油门/下降</div>
</div>
<div class="joystick-zone right" id="joystickRight">
  <div class="joystick-base"><div class="joystick-knob"></div></div>
  <div class="joystick-label">俯仰/翻滚</div>
</div>

<!-- 飞行模式切换按钮 -->
<button id="modeToggle" aria-label="飞行模式"><span class="mode-dot stable"></span>自稳模式</button>

<!-- AI对话浮动按钮（独立于面板，始终可见） -->
<button id="chatToggle" aria-label="AI助手">&#x1f4ac;</button>

<script src="./three.min.js"></script>
<script>
(function(){
'use strict';

/* ─── Globals ─── */
var game = {
  renderer: null, scene: null, camera: null,
  started: false, chestsCollected: 0, totalChests: 12,
  chests: [], clouds: [], dynamicObjects: [],
  velocity: new THREE.Vector3(),
  keys: {},
  speed: 0.5, maxSpeed: 1.8, accel: 0.04, friction: 0.97,
  yaw: 0, pitch: 0, roll: 0,
  flightMode: 'stable', /* 'stable'=自稳模式, 'manual'=手动模式 */
  STABLE_PITCH_LIMIT: 0.52, /* ~30度 */
  STABLE_ROLL_LIMIT: 0.35, /* ~20度 */
  clock: new THREE.Clock()
};

/* ─── LLM Callback System ─── */
window.__fpv_llmCallbacks = {};
window.__fpv_llmCallback = function(id, result) {
  var cb = window.__fpv_llmCallbacks[id];
  if (cb) { delete window.__fpv_llmCallbacks[id]; cb(result); }
};

/* ─── DOM Refs ─── */
var $canvasWrap    = document.getElementById('canvasWrap');
var $startScreen   = document.getElementById('startScreen');
var $startBtn      = document.getElementById('startBtn');
var $hud           = document.getElementById('hud');
var $hudSpeed      = document.getElementById('hudSpeed');
var $hudAlt        = document.getElementById('hudAlt');
var $hudChests     = document.getElementById('hudChests');
var $chatPanel     = document.getElementById('chatPanel');
var $chatToggle    = document.getElementById('chatToggle');
var $chatMessages  = document.getElementById('chatMessages');
var $chatInput     = document.getElementById('chatInput');
var $chatSend      = document.getElementById('chatSend');
var $chatClose     = document.getElementById('chatClose');
var $voiceBtn      = document.getElementById('voiceBtn');
var $notification  = document.getElementById('notification');
var $completion    = document.getElementById('completionScreen');
var $restartBtn    = document.getElementById('restartBtn');
var $joystickLeft  = document.getElementById('joystickLeft');
var $joystickRight = document.getElementById('joystickRight');
var $modeToggle = document.getElementById('modeToggle');

/* ─── Helpers ─── */
function notify(text, duration) {
  duration = duration || 2000;
  $notification.textContent = text;
  $notification.classList.add('show');
  setTimeout(function(){ $notification.classList.remove('show'); }, duration);
}

function isMobile() {
  return /Android|iPhone|iPad|iPod|webOS/i.test(navigator.userAgent) || ('ontouchstart' in window);
}

/* ─── Init Scene ─── */
function initScene() {
  try {
    var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    $canvasWrap.appendChild(renderer.domElement);
    game.renderer = renderer;

    var scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x87CEEB, 0.0018);
    game.scene = scene;

    var camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.5, 2000);
    camera.position.set(0, 25, 0);
    camera.rotation.order='YXZ';
    game.camera = camera;

    // Sky
    var skyGeo = new THREE.SphereGeometry(900, 32, 32);
    var skyMat = new THREE.ShaderMaterial({
      uniforms: { topColor: { value: new THREE.Color(0x0055aa) }, bottomColor: { value: new THREE.Color(0x87CEEB) }, offset: { value: 20 }, exponent: { value: 0.5 } },
      vertexShader: ['varying vec3 vWorldPosition;','void main(){','  vec4 wp=modelMatrix*vec4(position,1.0);','  vWorldPosition=wp.xyz;','  gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);','}'].join('\n'),
      fragmentShader: ['uniform vec3 topColor;','uniform vec3 bottomColor;','uniform float offset;','uniform float exponent;','varying vec3 vWorldPosition;','void main(){','  float h=normalize(vWorldPosition+offset).y;','  gl_FragColor=vec4(mix(bottomColor,topColor,max(pow(max(h,0.0),exponent),0.0)),1.0);','}'].join('\n'),
      side: THREE.BackSide
    });
    scene.add(new THREE.Mesh(skyGeo, skyMat));

    // Lights
    var sun = new THREE.DirectionalLight(0xfff5e0, 1.4);
    sun.position.set(200, 300, 100); sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.near = 1; sun.shadow.camera.far = 800;
    sun.shadow.camera.left = -300; sun.shadow.camera.right = 300;
    sun.shadow.camera.top = 300; sun.shadow.camera.bottom = -300;
    scene.add(sun);
    scene.add(new THREE.AmbientLight(0x6688cc, 0.5));
    scene.add(new THREE.HemisphereLight(0x88bbff, 0x445522, 0.4));

    // Ground
    var groundGeo = new THREE.PlaneGeometry(1600, 1600, 128, 128);
    groundGeo.rotateX(-Math.PI / 2);
    var verts = groundGeo.attributes.position;
    for (var i = 0; i < verts.count; i++) {
      var x = verts.getX(i), z = verts.getZ(i);
      verts.setY(i, Math.sin(x*0.008)*Math.cos(z*0.006)*12 + Math.sin(x*0.02+1.5)*Math.cos(z*0.015)*4 + Math.sin(x*0.05)*Math.cos(z*0.04)*1.5);
    }
    groundGeo.computeVertexNormals();
    var ground = new THREE.Mesh(groundGeo, new THREE.MeshStandardMaterial({ color: 0x3a7d32, roughness: 0.9, metalness: 0.0, flatShading: true }));
    ground.receiveShadow = true; scene.add(ground);

    // Water
    var water = new THREE.Mesh(new THREE.PlaneGeometry(300, 250, 1, 1), new THREE.MeshStandardMaterial({ color: 0x2288cc, transparent: true, opacity: 0.7, roughness: 0.1, metalness: 0.3 }));
    water.geometry.rotateX(-Math.PI/2); water.position.set(120, 2, -80); scene.add(water);

    // Trees (80)
    for (var t = 0; t < 80; t++) {
      var tx = (Math.random()-0.5)*1200, tz = (Math.random()-0.5)*1200;
      if (tx > 0 && tx < 280 && tz > -210 && tz < 50) continue;
      var tG = new THREE.Group();
      var tH = 3+Math.random()*4;
      var trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.5,tH,6), new THREE.MeshStandardMaterial({color:0x6B4226,roughness:0.9}));
      trunk.position.y=tH/2; trunk.castShadow=true; tG.add(trunk);
      for (var l=0;l<2+Math.floor(Math.random()*2);l++){
        var fS=2.8-l*0.6+Math.random()*0.5;
        var fol=new THREE.Mesh(new THREE.ConeGeometry(fS,3+Math.random(),7),new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(0.28+Math.random()*0.06,0.6,0.28+Math.random()*0.1),flatShading:true}));
        fol.position.y=tH+l*2; fol.castShadow=true; tG.add(fol);
      }
      tG.position.set(tx, getTerrainHeight(tx,tz), tz); scene.add(tG);
    }

    // Mountains (4)
    [{x:-200,z:-250,s:80,h:100},{x:250,z:-300,s:100,h:130},{x:-350,z:200,s:70,h:90},{x:400,z:250,s:90,h:110}].forEach(function(m){
      var mG=new THREE.Group();
      var mMesh=new THREE.Mesh(new THREE.ConeGeometry(m.s,m.h,8,4),new THREE.MeshStandardMaterial({color:0x6B705C,flatShading:true,roughness:0.95}));
      mMesh.position.y=m.h/2; mMesh.castShadow=true; mG.add(mMesh);
      var snow=new THREE.Mesh(new THREE.ConeGeometry(m.s*0.3,m.h*0.25,8),new THREE.MeshStandardMaterial({color:0xf0f0f0,flatShading:true,roughness:0.6}));
      snow.position.y=m.h*0.8; mG.add(snow);
      mG.position.set(m.x,0,m.z); scene.add(mG);
    });

    // Houses (3)
    [{x:-60,z:50},{x:80,z:120},{x:-180,z:-100}].forEach(function(h){
      var hG=new THREE.Group();
      var body=new THREE.Mesh(new THREE.BoxGeometry(8,6,10),new THREE.MeshStandardMaterial({color:0xD4A574,roughness:0.8}));
      body.position.y=3;body.castShadow=true;body.receiveShadow=true;hG.add(body);
      var roof=new THREE.Mesh(new THREE.ConeGeometry(7,4,4),new THREE.MeshStandardMaterial({color:0x8B4513,roughness:0.9}));
      roof.position.y=8;roof.rotation.y=Math.PI/4;roof.castShadow=true;hG.add(roof);
      var door=new THREE.Mesh(new THREE.PlaneGeometry(2,3.5),new THREE.MeshStandardMaterial({color:0x4a2f1a}));
      door.position.set(0,1.75,5.01);hG.add(door);
      var win=new THREE.Mesh(new THREE.PlaneGeometry(1.5,1.5),new THREE.MeshStandardMaterial({color:0x88ccff,emissive:0x446688,emissiveIntensity:0.3}));
      win.position.set(2,4,5.01);hG.add(win);var win2=win.clone();win2.position.x=-2;hG.add(win2);
      hG.position.set(h.x,getTerrainHeight(h.x,h.z),h.z);scene.add(hG);
    });

    // Chests (12)
    var chestPos=[{x:-50,z:30},{x:70,z:-60},{x:-150,z:150},{x:200,z:-200},{x:-300,z:-150},{x:350,z:100},{x:-100,z:-250},{x:0,z:200},{x:-250,z:50},{x:150,z:250},{x:-400,z:-50},{x:300,z:-50}];
    chestPos.forEach(function(cp,idx){
      var cG=new THREE.Group();
      var cB=new THREE.Mesh(new THREE.BoxGeometry(2,1.5,1.5),new THREE.MeshStandardMaterial({color:0xDAA520,metalness:0.5,roughness:0.3}));
      cB.position.y=0.75;cB.castShadow=true;cG.add(cB);
      var cL=new THREE.Mesh(new THREE.BoxGeometry(2.1,0.4,1.6),new THREE.MeshStandardMaterial({color:0xB8860B,metalness:0.5,roughness:0.3}));
      cL.position.y=1.7;cG.add(cL);
      var lk=new THREE.Mesh(new THREE.BoxGeometry(0.3,0.3,0.2),new THREE.MeshStandardMaterial({color:0xFFD700,metalness:0.8,roughness:0.1}));
      lk.position.set(0,1.3,0.76);cG.add(lk);
      var glow=new THREE.PointLight(0xFFD700,1.5,20);glow.position.y=2;cG.add(glow);
      var ring=new THREE.Mesh(new THREE.TorusGeometry(2,0.08,8,32),new THREE.MeshBasicMaterial({color:0xFFD700,transparent:true,opacity:0.4}));
      ring.rotation.x=Math.PI/2;ring.position.y=0.1;cG.add(ring);
      var cy=getTerrainHeight(cp.x,cp.z);
      cG.position.set(cp.x,cy,cp.z);
      cG.userData={collected:false,index:idx,ring:ring,glow:glow};
      game.chests.push(cG);scene.add(cG);
    });

    // Clouds (15)
    for (var c=0;c<15;c++){
      var clG=new THREE.Group();
      for(var p=0;p<3+Math.floor(Math.random()*4);p++){
        var pS=8+Math.random()*15;
        var puff=new THREE.Mesh(new THREE.SphereGeometry(pS,8,6),new THREE.MeshStandardMaterial({color:0xffffff,transparent:true,opacity:0.85,roughness:1}));
        puff.position.set((Math.random()-0.5)*20,(Math.random()-0.5)*5,(Math.random()-0.5)*10);
        puff.scale.y=0.4+Math.random()*0.3;clG.add(puff);
      }
      clG.position.set((Math.random()-0.5)*1400,80+Math.random()*80,(Math.random()-0.5)*1400);
      clG.userData={speed:0.02+Math.random()*0.05,origX:clG.position.x};

function getTerrainHeight(x, z) {
  return Math.sin(x*0.008)*Math.cos(z*0.006)*12 + Math.sin(x*0.02+1.5)*Math.cos(z*0.015)*4 + Math.sin(x*0.05)*Math.cos(z*0.04)*1.5;
}

/* ─── Animate ─── */
function animate() {
  requestAnimationFrame(animate);
  if (!game.renderer||!game.scene||!game.camera||!game.started) return;
  var dt=game.clock.getDelta(), k=game.keys, sp=game.speed;
  if (k['w']||k['arrowup']) sp=Math.min(sp+game.accel,game.maxSpeed);
  else if (k['s']||k['arrowdown']) sp=Math.max(sp-game.accel*0.5,0.05);
  else sp*=game.friction;
  if (sp<0.05) sp=0.05; game.speed=sp;
  var turnRate=0.025;
  if (k['a']||k['arrowleft']) game.yaw+=turnRate*sp*2;
  if (k['d']||k['arrowright']) game.yaw-=turnRate*sp*2;
  if (k[' ']) game.velocity.y+=0.08;
  if (k['shift']) game.velocity.y-=0.08;
  game.velocity.y*=0.94;
  if (k['w']||k['arrowup']) game.pitch=THREE.MathUtils.lerp(game.pitch,-0.15,0.03);
  else if (k['s']||k['arrowdown']) game.pitch=THREE.MathUtils.lerp(game.pitch,0.15,0.03);
  else game.pitch*=0.95;
  var targetRoll=0;
  if (k['a']||k['arrowleft']) targetRoll=0.3;
  if (k['d']||k['arrowright']) targetRoll=-0.3;
  game.roll=THREE.MathUtils.lerp(game.roll,targetRoll,0.05);
  /* 自稳模式：限制俯仰和翻滚角度 */
  if (game.flightMode === 'stable') {
    game.pitch = THREE.MathUtils.clamp(game.pitch, -game.STABLE_PITCH_LIMIT, game.STABLE_PITCH_LIMIT);
    game.roll = THREE.MathUtils.clamp(game.roll, -game.STABLE_ROLL_LIMIT, game.STABLE_ROLL_LIMIT);
  }
  var dir=new THREE.Vector3(0,0,-1).applyAxisAngle(new THREE.Vector3(0,1,0),game.yaw);
  game.camera.position.addScaledVector(dir,sp);
  game.camera.position.y+=game.velocity.y;
  var terrH=getTerrainHeight(game.camera.position.x,game.camera.position.z);
  if (game.camera.position.y<terrH+3){game.camera.position.y=terrH+3;game.velocity.y=Math.max(game.velocity.y,0);}
  if (game.camera.position.y>200) game.camera.position.y=200;
  game.camera.rotation.order='YXZ';
  game.camera.rotation.set(game.pitch, game.yaw, game.roll);
  game.clouds.forEach(function(cl){cl.position.x+=cl.userData.speed;if(cl.position.x>cl.userData.origX+200)cl.position.x=cl.userData.origX-200;});
  var camPos=game.camera.position;
  game.chests.forEach(function(ch){
    if(ch.userData.collected) return;
    ch.userData.ring.rotation.z+=0.02;
    ch.userData.glow.intensity=1.2+Math.sin(Date.now()*0.005)*0.5;
    if(camPos.distanceTo(ch.position)<5){
      ch.userData.collected=true;game.scene.remove(ch);game.chestsCollected++;
      notify('发现宝箱！('+game.chestsCollected+'/'+game.totalChests+')');
      if(game.chestsCollected>=game.totalChests) setTimeout(function(){$completion.classList.add('visible');},1000);
    }
  });
  $hudSpeed.textContent=(sp*100).toFixed(0);
  $hudAlt.textContent=Math.max(0,game.camera.position.y-terrH).toFixed(0);
  $hudChests.textContent=game.chestsCollected+'/'+game.totalChests;
  game.renderer.render(game.scene,game.camera);
}

/* ─── Controls ─── */
function setupControls() {
  document.addEventListener('keydown', function(e) { game.keys[e.key.toLowerCase()]=true; if(e.key===' ')e.preventDefault(); });
  document.addEventListener('keyup', function(e) { game.keys[e.key.toLowerCase()]=false; });
  if (isMobile()) {
    $joystickLeft.style.display='block';
    $joystickRight.style.display='block';
    initJoystick('left',$joystickLeft);
    initJoystick('right',$joystickRight);
  }

var joystickState = {left:{x:0,y:0,active:false,touchId:null},right:{x:0,y:0,active:false,touchId:null}};

function initJoystick(side, container) {
  var state = joystickState[side];
  state.knobEl = container.querySelector('.joystick-knob');
  var baseEl = container.querySelector('.joystick-base');
  var maxR = 42;
  function getCenter() {
    var r = baseEl.getBoundingClientRect();
    return {x: r.left + r.width/2, y: r.top + r.height/2};
  }
  container.addEventListener('touchstart', function(e) {
    e.preventDefault(); e.stopPropagation();
    if (state.active) return;
    var t = e.changedTouches[0];
    state.active = true; state.touchId = t.identifier;
    updateKnob(t);
  }, {passive:false});
  container.addEventListener('touchmove', function(e) {
    e.preventDefault(); e.stopPropagation();
    for (var i = 0; i < e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === state.touchId) { updateKnob(e.changedTouches[i]); break; }
    }
  }, {passive:false});
  function endTouch(e) {
    for (var i = 0; i < e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === state.touchId) {
        state.active = false; state.touchId = null; state.x = 0; state.y = 0;
        state.knobEl.style.transform = 'translate(-50%,-50%)';
        updateKeys(); break;
      }
    }
  }
  container.addEventListener('touchend', endTouch);
  container.addEventListener('touchcancel', endTouch);
  function updateKnob(touch) {
    var c = getCenter();
    var dx = touch.clientX - c.x, dy = touch.clientY - c.y;
    var dist = Math.sqrt(dx*dx + dy*dy);
    if (dist > maxR) { dx = dx/dist*maxR; dy = dy/dist*maxR; }
    state.knobEl.style.transform = 'translate(calc(-50% + '+dx+'px), calc(-50% + '+dy+'px))';
    state.x = dx/maxR; state.y = dy/maxR;
    updateKeys();
  }
  function updateKeys() {
    if (side === 'left') {
      game.keys['w'] = state.y < -0.3;
      game.keys['s'] = state.y > 0.3;
      game.keys['a'] = state.x < -0.3;
      game.keys['d'] = state.x > 0.3;
      game.keys[' '] = false; game.keys['shift'] = false;
    } else {
      game.pitch = -state.y * 0.3;
      var targetRoll = -state.x * 0.4;
      game.roll = THREE.MathUtils.lerp(game.roll, targetRoll, 0.1);
    }
  }
}

function handleLLMResponse(result) {
  try {
    var parsed = typeof result==='string'?JSON.parse(result):result;
    if (parsed.error) { addMsg(parsed.error,'system'); return; }
    var toolCalls = parsed.toolCalls;
    if (toolCalls && toolCalls.length>0) {
      for (var i=0;i<toolCalls.length;i++) {
        var tc=toolCalls[i];
        var args={};
        try{args=(typeof tc.args==='string')?JSON.parse(tc.args):(tc.args||{});}catch(e){args={};}
        executeTool(tc.name,args);
      }
    }
    if (parsed.text) { addMsg(parsed.text,'bot'); chatHistory.push({role:'assistant',content:parsed.text}); }
  } catch(e) {
    if (typeof result==='string'){addMsg(result,'bot');chatHistory.push({role:'assistant',content:result});}
    else addMsg('解析响应错误。','system');
  }
}

}

/* ─── Color Resolver ─── */
function resolveColor(c) {
  if (!c) return 0x4a7cc9;
  if (typeof c === 'number') return c;
  var s = String(c).trim().toUpperCase();
  var map = {RED:0xff4444,DARKRED:0xaa0000,CRIMSON:0xdc143c,GREEN:0x44bb44,DARKGREEN:0x006400,LIME:0x00ff00,FORESTGREEN:0x228b22,BLUE:0x4488ff,DARKBLUE:0x00008b,NAVY:0x000080,ROYALBLUE:0x4169e1,CYAN:0x00cccc,TEAL:0x008080,YELLOW:0xffdd00,GOLD:0xffd700,ORANGE:0xff8800,REDORANGE:0xff4500,CORAL:0xff7f50,PURPLE:0x8844cc,VIOLET:0xee82ee,MAGENTA:0xff00ff,PINK:0xff69b4,HOTPINK:0xff69b4,WHITE:0xffffff,SNOW:0xfffafa,IVORY:0xfffff0,SILVER:0xc0c0c0,GRAY:0x888888,DARKGRAY:0x444444,BLACK:0x222222,BROWN:0x8B4513,SANDYBROWN:0xf4a460,TAN:0xd2b48c,CHOCOLATE:0xd2691e,WOOD:0x6B4226,SKYBLUE:0x87ceeb,STEEL:0x71797E,BRONZE:0xcd7f32,COPPER:0xb87333,RUST:0xb7410e,OLIVE:0x808000,KHAKI:0xc3b091,BEIGE:0xf5f5dc,MAROON:0x800000};
  if (map[s]) return map[s];
  if (s.charAt(0)==='#') return parseInt(s.slice(1),16);
  return 0x4a7cc9;
}

/* ─── Tool Execution ─── */
function executeTool(name, args) {
  if (typeof args==='string'){try{args=JSON.parse(args);}catch(e){args={};}}
  if (!args||typeof args!=='object') args={};
  if (!game.scene) return;
  var pos=args.position||null;
  if (!pos) {
    var fwd=new THREE.Vector3(0,0,-1).applyAxisAngle(new THREE.Vector3(0,1,0),game.yaw);
    pos={x:game.camera.position.x+fwd.x*30+(Math.random()-0.5)*20, z:game.camera.position.z+fwd.z*30+(Math.random()-0.5)*20};
  }
  var px=pos.x||0, pz=pos.z||0, py=args.y!==undefined?args.y:getTerrainHeight(px,pz);
  var obj=null;
  switch(name) {
    case 'addTree': obj=createTree(px,py,pz,args); break;
    case 'addRock': obj=createRock(px,py,pz,args); break;
    case 'addHouseBody': obj=createHouse(px,py,pz,args); break;
    case 'addCloud': obj=createCloudObj(px,py,pz,args); break;
    case 'addFlower': obj=createFlower(px,py,pz,args); break;
    case 'addCrate': obj=createCrate(px,py,pz,args); break;
    case 'addSign': obj=createSign(px,py,pz,args); break;
    case 'addLamp': obj=createLamp(px,py,pz,args); break;
    case 'executeCode': obj=executeCode(args); break;
    case 'removeDynamic': removeDynamic(args); return;
    case 'clearDynamicObjects': clearDynamicObjects(); return;
    case 'addCompositeObject': obj=addCompositeObject(px,py,pz,args.parts); break;
    default: addMsg('未知工具: '+name,'system'); return;
  }
  if (obj) { game.dynamicObjects.push(obj); game.scene.add(obj); }
}

function addCompositeObject(x, y, z, parts) {
  if (!parts) return null;
  if (typeof parts === 'string') { try { parts = JSON.parse(parts); } catch(e) { return null; } }
  if (!Array.isArray(parts)) return null;
  var group = new THREE.Group();
  for (var i = 0; i < parts.length; i++) {
    var p = parts[i];
    var type = (p.type || 'box').toLowerCase();
    var ox = p.ox || 0, oy = p.oy || 0, oz = p.oz || 0;
    var col = resolveColor(p.color);
    var matOpts = { color: col, roughness: p.roughness !== undefined ? p.roughness : 0.6, metalness: p.metalness !== undefined ? p.metalness : 0.2 };
    if (p.emissive) { matOpts.emissive = resolveColor(p.emissive); matOpts.emissiveIntensity = p.emissiveIntensity || 0.5; }
    if (p.transparent) { matOpts.transparent = true; matOpts.opacity = p.opacity !== undefined ? p.opacity : 0.5; }
    var geo, mesh;
    switch(type) {
      case 'sphere': geo = new THREE.SphereGeometry(p.r||1,16,16); mesh = new THREE.Mesh(geo,new THREE.MeshStandardMaterial(matOpts)); mesh.position.set(ox,oy,oz); break;
      case 'cylinder': geo = new THREE.CylinderGeometry(p.rt||0.5,p.rb||0.5,p.h||2,12); mesh = new THREE.Mesh(geo,new THREE.MeshStandardMaterial(matOpts)); mesh.position.set(ox,oy+(p.h||2)/2,oz); break;
      case 'cone': geo = new THREE.ConeGeometry(p.r||1,p.h||2,12); mesh = new THREE.Mesh(geo,new THREE.MeshStandardMaterial(matOpts)); mesh.position.set(ox,oy+(p.h||2)/2,oz); break;
      case 'torus': geo = new THREE.TorusGeometry(p.r||1,p.tube||0.3,12,24); mesh = new THREE.Mesh(geo,new THREE.MeshStandardMaterial(matOpts)); mesh.position.set(ox,oy,oz); break;
      case 'plane': geo = new THREE.PlaneGeometry(p.w||2,p.h||2); mesh = new THREE.Mesh(geo,new THREE.MeshStandardMaterial(matOpts)); mesh.position.set(ox,oy,oz); break;
      default: geo = new THREE.BoxGeometry(p.w||1,p.h||1,p.d||1); mesh = new THREE.Mesh(geo,new THREE.MeshStandardMaterial(matOpts)); mesh.position.set(ox,oy+(p.h||1)/2,oz); break;
    }
    if (mesh) {
      if (p.rx) mesh.rotation.x = (p.rx * Math.PI / 180);
      if (p.ry) mesh.rotation.y = (p.ry * Math.PI / 180);
      if (p.rz) mesh.rotation.z = (p.rz * Math.PI / 180);
      if (p.sx || p.sy || p.sz) mesh.scale.set(p.sx||1, p.sy||1, p.sz||1);
      mesh.castShadow = true; mesh.receiveShadow = true;
      group.add(mesh);
    }
  }
  group.position.set(x, y, z);
  if (args) {
    // rotationY from args
  }
  return group;
}

function createCrate(x,y,z,args){var s=args.scale||1;var crate=new THREE.Mesh(new THREE.BoxGeometry(1.5*s,1.5*s,1.5*s),new THREE.MeshStandardMaterial({color:0xA0722A,roughness:0.85}));crate.position.set(x,y+0.75*s,z);crate.castShadow=true;var plank1=new THREE.Mesh(new THREE.BoxGeometry(1.6*s,0.08*s,0.08*s),new THREE.MeshStandardMaterial({color:0x7a5518}));plank1.position.set(0,0,0.76*s);crate.add(plank1);var plank2=plank1.clone();plank2.rotation.z=Math.PI/2;crate.add(plank2);return crate;}

function createSign(x,y,z,args){var g=new THREE.Group();var post=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,3,6),new THREE.MeshStandardMaterial({color:0x6B4226}));post.position.y=1.5;post.castShadow=true;g.add(post);var board=new THREE.Mesh(new THREE.BoxGeometry(2.5,1.2,0.15),new THREE.MeshStandardMaterial({color:0xDEB887}));board.position.y=3;board.castShadow=true;g.add(board);var text=args.text||'欢迎！';var canvas=document.createElement('canvas');canvas.width=256;canvas.height=128;var ctx=canvas.getContext('2d');ctx.fillStyle='#DEB887';ctx.fillRect(0,0,256,128);ctx.fillStyle='#4a2f1a';ctx.font='bold 28px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(text,128,64);var tex=new THREE.CanvasTexture(canvas);var label=new THREE.Mesh(new THREE.PlaneGeometry(2.4,1.1),new THREE.MeshBasicMaterial({map:tex,transparent:true}));label.position.set(0,3,0.08);g.add(label);g.position.set(x,y,z);return g;}

function createLamp(x,y,z,args){var g=new THREE.Group();var pole=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.1,4,6),new THREE.MeshStandardMaterial({color:0x333333,metalness:0.8}));pole.position.y=2;pole.castShadow=true;g.add(pole);var bulb=new THREE.Mesh(new THREE.SphereGeometry(0.25,8,8),new THREE.MeshStandardMaterial({color:0xffffcc,emissive:0xffee88,emissiveIntensity:1.5}));bulb.position.y=4.2;g.add(bulb);var light=new THREE.PointLight(0xffee88,1,30);light.position.y=4.2;g.add(light);g.position.set(x,y,z);return g;}

function executeCode(args){var shape=(args.shape||'box').toLowerCase();var px=args.position?args.position.x:game.camera.position.x;var pz=args.position?args.position.z:game.camera.position.z;var py=args.y!==undefined?args.y:getTerrainHeight(px,pz)+2;var s=args.scale||2;var col=args.color||0x4a7cc9;var geo;switch(shape){case 'box':geo=new THREE.BoxGeometry(s,s,s);break;case 'sphere':geo=new THREE.SphereGeometry(s*0.6,16,16);break;case 'cylinder':geo=new THREE.CylinderGeometry(s*0.5,s*0.5,s,12);break;case 'cone':geo=new THREE.ConeGeometry(s*0.6,s*1.5,12);break;case 'torus':geo=new THREE.TorusGeometry(s*0.6,s*0.2,12,24);break;default:geo=new THREE.BoxGeometry(s,s,s);}var mesh=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:col,roughness:0.5,metalness:0.3}));mesh.position.set(px,py,pz);mesh.castShadow=true;mesh.receiveShadow=true;return mesh;}

function removeDynamic(args){if(typeof args==='string'){try{args=JSON.parse(args);}catch(e){args={};}}var idx=args.index;if(typeof idx==='number'&&idx>=0&&idx<game.dynamicObjects.length){var obj=game.dynamicObjects[idx];game.scene.remove(obj);game.dynamicObjects.splice(idx,1);}}

function clearDynamicObjects(){game.dynamicObjects.forEach(function(obj){game.scene.remove(obj);});game.dynamicObjects=[];}

/* ─── Start / Restart ─── */
function toggleFlightMode() {
  if (game.flightMode === 'stable') {
    game.flightMode = 'manual';
    $modeToggle.innerHTML = '<span class="mode-dot manual"></span>手动模式';
    notify('已切换为手动模式 — 俯仰翻滚无限制，可大角度飞行');
  } else {
    game.flightMode = 'stable';
    game.pitch = THREE.MathUtils.clamp(game.pitch, -game.STABLE_PITCH_LIMIT, game.STABLE_PITCH_LIMIT);
    game.roll = THREE.MathUtils.clamp(game.roll, -game.STABLE_ROLL_LIMIT, game.STABLE_ROLL_LIMIT);
    $modeToggle.innerHTML = '<span class="mode-dot stable"></span>自稳模式';
    notify('已切换为自稳模式 — 俯仰角限制±30°，自动回正');
  }
}

function startGame() {
  $startScreen.classList.add('hidden');
  $hud.classList.add('visible');
  $modeToggle.classList.add('visible');
  game.started = true;
  game.clock.start();
  addMsg('欢迎来到灵境！左摇杆控制飞行方向和油门，右摇杆控制俯仰翻滚。点击右上角 💬 打开AI助手，用文字或语音描述你想建造的场景。', 'bot');
}

function restartGame() {
  $completion.classList.remove('visible');
  game.chestsCollected=0;game.speed=0.5;game.yaw=0;game.pitch=0;game.roll=0;
  game.velocity.set(0,0,0);game.camera.position.set(0,25,0);game.camera.rotation.order='YXZ';game.camera.rotation.set(0,0,0);
  clearDynamicObjects();
  game.chests.forEach(function(ch){if(ch.userData.collected){ch.userData.collected=false;game.scene.add(ch);}});
}

/* ─── Resize ─── */
function onResize(){if(!game.renderer||!game.camera)return;game.camera.aspect=window.innerWidth/window.innerHeight;game.camera.updateProjectionMatrix();game.renderer.setSize(window.innerWidth,window.innerHeight);}

/* ─── Init ─── */
function init() {
  initScene();
  setupControls();
  animate();
  $startBtn.addEventListener('click', startGame);
  $restartBtn.addEventListener('click', restartGame);
  $chatToggle.addEventListener('click', toggleChat);
  $chatClose.addEventListener('click', function(e){e.stopPropagation();$chatPanel.classList.remove('open');});
  $chatSend.addEventListener('click', sendChat);
  $chatInput.addEventListener('keydown', function(e){if(e.key==='Enter')sendChat();e.stopPropagation();});
  $chatInput.addEventListener('keyup', function(e){e.stopPropagation();});
  // 语音按钮 → 弹出语音悬浮框（带权限检查）
  $voiceBtn.addEventListener('click', function(e){
    e.stopPropagation(); e.preventDefault();
    try {
      if(window.AndroidBridge && window.AndroidBridge.showVoiceFloat) {
        window.AndroidBridge.showVoiceFloat();
      } else {
        notify('语音功能不可用');
      }
    }
    catch(ex) { notify('语音功能不可用'); }
  });
  // 飞行模式切换
  $modeToggle.innerHTML = '<span class="mode-dot stable"></span>自稳模式';
  $modeToggle.addEventListener('click', function(e){
    e.stopPropagation(); e.preventDefault();
    toggleFlightMode();
  });
  window.addEventListener('resize', onResize);
  $canvasWrap.addEventListener('touchmove', function(e){e.preventDefault();},{passive:false});
}

init();

})();
</script>
</body>
</html>
